<!doctype html>
<!--
  TEST JETABLE - ne sert qu'à vérifier la connexion Web Bluetooth au MetaMotion MMS.
  Ce code n'est PAS la base de l'app finale.

  Protocole relevé dans MetaWear-SDK-Cpp (accelerometer_bosch.cpp, gyro_bosch.cpp, datasignal.cpp) :
    Service  326a9000-85cb-9195-d9dd-464cfbbae75a
    Commande 326a9001-...   (écriture)      Notification 326a9006-...
    Accéléro BMI270 = module 0x03 :  config [03 03 A8 range] -> subscribe [03 04 01] -> enable [03 02 01 00] -> start [03 01 01]
    Gyro     BMI270 = module 0x13 :  config [13 03 28 00]    -> subscribe [13 04 01] -> enable [13 02 01 00] -> start [13 01 01]
    Lecture info module : [module 80]  ->  réponse [module 80 implémentation révision ...]
    Données : [module 04 xLo xHi yLo yHi zLo zHi], int16 little-endian
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Bluetooth MMS</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:16px; background:#0e1014; color:#e8eaed; font:15px system-ui,sans-serif; max-width:560px; margin-inline:auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#9aa0a6; font-size:12px; margin-bottom:14px; }
  button { font:inherit; padding:12px 16px; border-radius:10px; border:0; background:#2563eb; color:#fff; font-weight:600; }
  button:disabled { background:#2a2e36; color:#6b7280; }
  button.stop { background:#ef4444; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  .card { background:#171a21; border-radius:12px; padding:12px; margin-bottom:12px; }
  .lbl { font-size:11px; color:#9aa0a6; text-transform:uppercase; letter-spacing:.5px; }
  .vals { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; margin-top:6px; }
  .vals b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .vals span { font-size:11px; color:#9aa0a6; }
  #status { font-weight:600; }
  .ok { color:#34d399; } .bad { color:#f87171; } .warn { color:#fbbf24; }
  canvas { width:100%; height:120px; background:#0e1014; border-radius:8px; display:block; }
  pre { margin:0; font:11px/1.4 ui-monospace,Consolas,monospace; max-height:200px; overflow:auto; white-space:pre-wrap; color:#b6bcc6; }
  select { font:inherit; padding:8px; border-radius:8px; background:#171a21; color:#e8eaed; border:1px solid #2a2e36; }
</style>
</head>
<body>
  <h1>Test Bluetooth MetaMotion MMS</h1>
  <div class="sub">Test jetable. Réveille le capteur (bouton, LED qui clignote) et ferme les scripts Python : le capteur n'accepte qu'une connexion à la fois.</div>

  <div class="row">
    <button id="btnConnect">1. Connecter</button>
    <button id="btnStart" disabled>2. Démarrer le flux</button>
    <button id="btnStop" class="stop" disabled>Arrêter</button>
    <label class="lbl">Plage accéléro
      <select id="range"><option value="1">±4 g</option><option value="2" selected>±8 g</option><option value="3">±16 g</option></select>
    </label>
  </div>

  <div class="card">
    <div class="lbl">État</div>
    <div id="status" class="warn">Non connecté</div>
    <div id="support" class="sub" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <div class="lbl">Accéléromètre (g) · <span id="accHz">0</span> Hz mesurés</div>
    <div class="vals"><div><b id="ax">-</b><span>X</span></div><div><b id="ay">-</b><span>Y</span></div><div><b id="az">-</b><span>Z</span></div></div>
    <canvas id="plot" width="520" height="120"></canvas>
  </div>

  <div class="card">
    <div class="lbl">Gyroscope (°/s) · <span id="gyHz">0</span> Hz mesurés</div>
    <div class="vals"><div><b id="gx">-</b><span>X</span></div><div><b id="gy">-</b><span>Y</span></div><div><b id="gz">-</b><span>Z</span></div></div>
  </div>

  <div class="card">
    <div class="lbl">Journal</div>
    <pre id="log"></pre>
  </div>

<script>
const SERVICE = '326a9000-85cb-9195-d9dd-464cfbbae75a';
const CHAR_CMD = '326a9001-85cb-9195-d9dd-464cfbbae75a';
const CHAR_NOTIFY = '326a9006-85cb-9195-d9dd-464cfbbae75a';
const MOD_ACC = 0x03, MOD_GYRO = 0x13;
const ACC_SCALE = { 1: 8192, 2: 4096, 3: 2048 };  // LSB par g, selon la plage (BMI270)
const GYRO_SCALE = 16.4;                          // LSB par °/s à ±2000 °/s

const $ = id => document.getElementById(id);
let device, cmdChar, notifyChar, streaming = false, accScale = 4096;
const counts = { acc: 0, gyro: 0 };
const trace = [];  // derniers échantillons accéléro pour le tracé

function log(msg, cls) {
  const el = $('log');
  const t = new Date().toLocaleTimeString();
  el.textContent += `[${t}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}
function setStatus(text, cls) { const s = $('status'); s.textContent = text; s.className = cls || ''; }
const hex = dv => Array.from(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength)).map(b => b.toString(16).padStart(2, '0')).join(' ');

if (!navigator.bluetooth) {
  $('support').textContent = "Web Bluetooth indisponible ici (utilise Chrome ou Edge, en HTTPS ou sur localhost).";
  $('btnConnect').disabled = true;
} else {
  $('support').textContent = 'Web Bluetooth disponible.';
}

async function send(bytes) {
  const data = new Uint8Array(bytes);
  if (cmdChar.writeValueWithoutResponse) await cmdChar.writeValueWithoutResponse(data);
  else await cmdChar.writeValue(data);
  await new Promise(r => setTimeout(r, 30));  // petit espacement entre commandes
}

function onNotify(ev) {
  const dv = ev.target.value;
  if (dv.byteLength < 2) return;
  const mod = dv.getUint8(0), reg = dv.getUint8(1);
  if (reg === 0x80) { log(`Info module 0x${mod.toString(16)} : ${hex(dv)}  -> ${dv.byteLength > 2 ? 'implémentation ' + dv.getUint8(2) + ', révision ' + dv.getUint8(3) : 'ABSENT'}`); return; }
  if (reg === 0x04 && dv.byteLength >= 8) {
    const x = dv.getInt16(2, true), y = dv.getInt16(4, true), z = dv.getInt16(6, true);
    if (mod === MOD_ACC) {
      counts.acc++;
      const g = [x, y, z].map(v => v / accScale);
      $('ax').textContent = g[0].toFixed(2); $('ay').textContent = g[1].toFixed(2); $('az').textContent = g[2].toFixed(2);
      trace.push(g); if (trace.length > 260) trace.shift();
    } else if (mod === MOD_GYRO) {
      counts.gyro++;
      $('gx').textContent = (x / GYRO_SCALE).toFixed(0); $('gy').textContent = (y / GYRO_SCALE).toFixed(0); $('gz').textContent = (z / GYRO_SCALE).toFixed(0);
    }
    return;
  }
  log('Paquet non reconnu : ' + hex(dv));
}

async function connect() {
  try {
    setStatus('Recherche du capteur...', 'warn');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }, { namePrefix: 'MetaWear' }],
      optionalServices: [SERVICE]
    });
    log('Appareil choisi : ' + (device.name || '(sans nom)') + ' ' + device.id);
    device.addEventListener('gattserverdisconnected', () => {
      streaming = false; setStatus('Déconnecté', 'bad'); log('Déconnecté par le capteur ou hors de portée.');
      $('btnStart').disabled = true; $('btnStop').disabled = true; $('btnConnect').disabled = false;
    });
    setStatus('Connexion GATT... (15 s max)', 'warn');
    $('btnConnect').disabled = true;
    const server = await Promise.race([
      device.gatt.connect(),
      new Promise((_, rej) => setTimeout(() => rej(new Error("délai dépassé (15 s) : le capteur ne répond pas à la connexion")), 15000))
    ]);
    const svc = await server.getPrimaryService(SERVICE);
    cmdChar = await svc.getCharacteristic(CHAR_CMD);
    notifyChar = await svc.getCharacteristic(CHAR_NOTIFY);
    notifyChar.addEventListener('characteristicvaluechanged', onNotify);
    await notifyChar.startNotifications();
    log('Notifications activées.');
    // Lecture des infos de module pour confirmer le matériel
    await send([MOD_ACC, 0x80]);
    await send([MOD_GYRO, 0x80]);
    setStatus('Connecté', 'ok');
    $('btnStart').disabled = false; $('btnConnect').disabled = true;
  } catch (e) {
    setStatus('Échec : ' + e.message, 'bad'); log('ERREUR connexion : ' + e.name + ' - ' + e.message);
    try { if (device && device.gatt.connected) device.gatt.disconnect(); } catch (_) {}
    $('btnConnect').disabled = false;
  }
}

async function start() {
  try {
    const range = parseInt($('range').value, 10);
    accScale = ACC_SCALE[range];
    counts.acc = counts.gyro = 0;
    // Accéléromètre : 100 Hz (octet 0xA8), plage choisie
    await send([MOD_ACC, 0x03, 0xA8, range]);
    await send([MOD_ACC, 0x04, 0x01]);          // subscribe
    await send([MOD_ACC, 0x02, 0x01, 0x00]);    // enable sampling
    await send([MOD_ACC, 0x01, 0x01]);          // power on
    // Gyroscope : 100 Hz (0x28), ±2000 °/s (0x00)
    await send([MOD_GYRO, 0x03, 0x28, 0x00]);
    await send([MOD_GYRO, 0x04, 0x01]);
    await send([MOD_GYRO, 0x02, 0x01, 0x00]);
    await send([MOD_GYRO, 0x01, 0x01]);
    streaming = true; lastTick = performance.now();
    setStatus('Flux en cours', 'ok'); log('Flux démarré (acc 100 Hz, gyro 100 Hz).');
    $('btnStart').disabled = true; $('btnStop').disabled = false;
  } catch (e) {
    setStatus('Échec démarrage : ' + e.message, 'bad'); log('ERREUR démarrage : ' + e.name + ' - ' + e.message);
  }
}

async function stop() {
  try {
    for (const m of [MOD_ACC, MOD_GYRO]) {
      await send([m, 0x01, 0x00]);          // power off
      await send([m, 0x02, 0x00, 0x01]);    // disable sampling
      await send([m, 0x04, 0x00]);          // unsubscribe
    }
    streaming = false; setStatus('Connecté (flux arrêté)', 'ok'); log('Flux arrêté.');
    $('btnStart').disabled = false; $('btnStop').disabled = true;
  } catch (e) { log('ERREUR arrêt : ' + e.message); }
}

// Mesure de la fréquence réelle + tracé
let lastTick = performance.now();
setInterval(() => {
  const now = performance.now(), dt = (now - lastTick) / 1000; lastTick = now;
  $('accHz').textContent = streaming ? Math.round(counts.acc / dt) : 0;
  $('gyHz').textContent = streaming ? Math.round(counts.gyro / dt) : 0;
  counts.acc = counts.gyro = 0;
}, 1000);

const cv = $('plot'), ctx = cv.getContext('2d');
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#2a2e36'; ctx.beginPath(); ctx.moveTo(0, 60); ctx.lineTo(cv.width, 60); ctx.stroke();
  const cols = ['#f87171', '#34d399', '#60a5fa'];
  for (let a = 0; a < 3; a++) {
    ctx.strokeStyle = cols[a]; ctx.lineWidth = 1.5; ctx.beginPath();
    trace.forEach((g, i) => { const px = i * cv.width / 260, py = 60 - g[a] * 20; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.stroke();
  }
  requestAnimationFrame(draw);
}
draw();

$('btnConnect').onclick = connect; $('btnStart').onclick = start; $('btnStop').onclick = stop;
</script>
</body>
</html>
