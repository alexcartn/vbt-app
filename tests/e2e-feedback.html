<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../style.css"></head><body>
<div id="app"></div><nav id="nav"><button data-v="seance" class="on">Séance</button><button data-v="profil">Profil</button><button data-v="histo">Historique</button></nav><div id="toast"></div>
<pre id="result">en cours</pre>
<script>const errors = []; window.addEventListener('error', e => errors.push(e.message));</script>
<script type="module">
// Scénario de bout en bout (simulation) : perte de vitesse, alerte d'arrêt, correction des reps, exports.
// Lancer : python -m http.server puis ouvrir tests/e2e-feedback.html (ou Edge/Chrome headless --dump-dom).
import '../js/app.js';
const wait = ms => new Promise(r => setTimeout(r, ms));
const $ = s => document.querySelector(s), click = s => $(s).click();
const db = () => JSON.parse(localStorage.getItem('vbt.v1'));
const r = { errors };
const blobs = []; const origCreate = URL.createObjectURL; URL.createObjectURL = b => { blobs.push(b); return origCreate(b); };

await wait(200);
r.setupOpts = !!$('.opts') && document.querySelectorAll('.opts .seg button').length;      // 4 seuils + 2 bascules
r.defaultLossOn = $('[data-act=loss].on')?.textContent;

click('[data-act=sim]'); await wait(4500);
r.barsLive = document.querySelectorAll('.bar').length;
r.stopbar = $('.stopbar')?.textContent ?? null;
r.deltaText = $('.delta')?.textContent;
click('[data-act=end]'); await wait(100);
r.savedReps = db().sets[0].reps.length;
r.rawBtn = !!$('[data-act=exportraw]');

// corrections : rep 2 ratée, rep 1 supprimée
$('.bar[data-i="1"]').dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50);
click('[data-act=fail]'); await wait(50);
r.failedPersisted = db().sets[0].reps[1].failed === true;
r.failedBarClass = $('.bar[data-i="1"]').getAttribute('class');
r.statsAfterFail = $('.delta')?.textContent;
$('.bar[data-i="0"]').dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50);
click('[data-act=delrep]'); await wait(50);
r.afterDelete = db().sets[0].reps.length;
r.barsAfterDelete = document.querySelectorAll('.bar').length;

// export brut
click('[data-act=exportraw]'); await wait(50);
const csv = await blobs[blobs.length - 1].text(), lines = csv.trim().split('\n');
r.csv = { lines: lines.length, head: lines.slice(0, 4), firstSample: lines[3] };

// réglages persistés
click('[data-act=loss][data-v="0"]'); await wait(50);
click('[data-act=tog][data-v=sound]'); await wait(50);
r.settings = db().settings;

// historique + export JSON
click('#nav button[data-v=histo]'); await wait(50);
r.histo = $('.hset')?.textContent.trim();
r.exportHistBtn = !!$('[data-act=exporthist]');
document.title = 'fini';
$('#result').textContent = JSON.stringify(r, null, 1);
</script></body></html>
