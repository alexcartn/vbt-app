<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../style.css"></head><body>
<div id="app"></div><nav id="nav"><button data-v="seance" class="on">Séance</button><button data-v="profil">1RM</button><button data-v="histo">Historique</button></nav><div id="toast"></div>
<pre id="result">en cours</pre>
<script>
const errors = []; window.addEventListener('error', e => errors.push(e.message));
localStorage.clear();
const vibrations = []; navigator.vibrate = p => { vibrations.push(p); return true; };
</script>
<script type="module">
// Scénario du minuteur de repos : réglage, démarrage à la fin de série, fin du repos (horloge avancée), « Passer », annulation au départ d'une série.
import '../js/app.js';
const wait = ms => new Promise(r => setTimeout(r, ms));
const $ = s => document.querySelector(s), click = s => $(s).click();
const db = () => JSON.parse(localStorage.getItem('vbt.v1'));
const r = { errors };
try {
await wait(200);
r.defaultRest = db()?.settings?.rest ?? 'non écrit (0 par défaut)';
r.restButtons = [...document.querySelectorAll('[data-act=rest]')].map(b => b.textContent + (b.classList.contains('on') ? '*' : ''));

click('[data-act=sim]'); await wait(4200); click('[data-act=end]'); await wait(100);
r.offNoTimer = !$('#restBox');                                  // minuteur désactivé par défaut

click('[data-act=rest][data-v="120"]'); await wait(50);
r.savedRest = db().settings.rest;
click('[data-act=sim]'); await wait(4200); click('[data-act=end]'); await wait(700);
r.started = { box: !!$('#restBox'), text: $('#restTime')?.textContent, role: $('#restBox')?.getAttribute('role'), over: $('#restBox')?.classList.contains('over') };

const before = vibrations.length;
const real = Date.now; Date.now = () => real() + 130000;       // on avance l'horloge de 130 s
await wait(700);
r.finished = { text: $('#restTime')?.textContent, over: $('#restBox')?.classList.contains('over'), caption: $('#restCap')?.textContent, timerSignals: vibrations.length - before };
await wait(1200);
r.singleSignal = vibrations.length - before;                             // pas de signal répété
Date.now = real;

click('[data-act=restskip]'); await wait(50);
r.afterSkip = !$('#restBox');

click('[data-act=sim]'); await wait(300);                       // démarrer une nouvelle série : plus de minuteur
r.hiddenWhileRecording = !$('#restBox');
click('[data-act=end]'); await wait(100);
} catch (e) { r.exception = String(e.stack || e); }
document.title = 'fini';
$('#result').textContent = JSON.stringify(r, null, 1);
</script></body></html>
